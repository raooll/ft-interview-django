services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ft_interview}
      POSTGRES_USER: ${POSTGRES_USER:-ft_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ft_password}
    ports:
      # Override POSTGRES_HOST_PORT in .env if you already have Postgres on 5432.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ft_user} -d ${POSTGRES_DB:-ft_interview}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    command: ./entrypoint.sh
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-do-not-use-in-prod}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_DB: ${POSTGRES_DB:-ft_interview}
      POSTGRES_USER: ${POSTGRES_USER:-ft_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ft_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      AMADEUS_MODE: ${AMADEUS_MODE:-mock}
      AMADEUS_CLIENT_ID: ${AMADEUS_CLIENT_ID:-}
      AMADEUS_CLIENT_SECRET: ${AMADEUS_CLIENT_SECRET:-}
      AMADEUS_BASE_URL: ${AMADEUS_BASE_URL:-https://test.api.amadeus.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_HOST_PORT:-3000}}
    ports:
      # Override BACKEND_HOST_PORT in .env if you already have something on 8000.
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    command: bun run dev
    environment:
      # Browser fetches the host-mapped backend port; follows BACKEND_HOST_PORT.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_HOST_PORT:-8000}}
    ports:
      # Override FRONTEND_HOST_PORT in .env if you already have something on 3000.
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
